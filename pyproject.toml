[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reset-detection"
version = "0.1.0"
description = "Detect whether robotic arms have returned to home position"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pyyaml>=6.0",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
]
